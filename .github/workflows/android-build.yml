name: Build VICTOR AI APK
on:
  push:
    branches: [arena/01a0eeb9-victor-android-assistant]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses < /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build installable debug APK
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gradle --no-daemon assembleDebug > /tmp/victor-build.log 2>&1 && exit 0
          tail -100 /tmp/victor-build.log
          gh api -X POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name='Android build diagnostics' -f head_sha="$GITHUB_SHA" \
            -f status=completed -f conclusion=failure \
            -f 'output[title]=APK build failed' \
            -f "output[summary]=$(tail -c 26000 /tmp/victor-build.log)" > /dev/null || true
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: VICTOR-AI-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish installable APK on this branch
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk VICTOR-AI-debug.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f VICTOR-AI-debug.apk
          git commit -m 'Attach built VICTOR AI debug APK' 
          git push origin HEAD:arena/01a0eeb9-victor-android-assistant
